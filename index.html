<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDES UP</title>
<link rel="stylesheet" href="estilos.css">
<style>
/* Portada con logo recortado */
.hero {
  display: flex;
  align-items: stretch;
  gap: 3rem;
  position: relative;
  overflow: hidden; /* Recorta cualquier elemento que sobresalga del marco */
}

.hero-texto {
  flex: 0 1 36rem;
  min-width: 0;
  z-index: 1; /* Asegura que el texto siempre quede por encima del logo */
}

.hero-logo {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
}

.hero-logo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0.7;
  transform: scale(1.4); /* Agranda el logo un 40% */
  transform-origin: center right; /* Define el punto de anclaje de la ampliación */
}

@media (max-width: 46rem) {
  .hero {
    flex-direction: column;
  }
  .hero-logo {
    flex: none;
    height: 11rem;
  }
  .hero-logo img {
    transform: scale(1.2); /* Ajuste opcional para móviles */
    transform-origin: center;
  }
}
</style>
</head>
<body data-pagina="inicio">
<a class="salto" href="#contenido">Saltar al contenido</a>
<header class="cab" id="cab"></header>
<main class="ancho" id="contenido" tabindex="-1">
<section class="hero">
  <div class="hero-texto">
    <h1>Círculo de Desarrollo Económico y Social de la Universidad del Pacífico</h1>
    <p class="lead">Texto provisional: aquí irá una frase breve que explique qué hace el círculo.</p>
    <a class="boton" href="/publicaciones">Ver publicaciones</a>
  </div>
  <div class="hero-logo"><img src="Assets/Logo CDES Blanco Limpio.png" alt="" onerror="this.remove()"></div>
</section>
<h2>Publicaciones recientes</h2>
<div id="recientes"><p class="vacio">Cargando…</p></div>
</main>
<footer id="pie"></footer>
<script src="sitio.js"></script>
<script>
const rec = document.getElementById('recientes');
cargarDocs().then(docs => {
  rec.replaceChildren();
  if (!docs.length) return rec.append($('p', 'vacio', 'Todavía no hay publicaciones.'));
  const ul = $('ul'); [...docs].sort(porFecha).slice(0, 5).forEach(d => ul.append(itemDoc(d, true))); rec.append(ul);
}).catch(() => rec.replaceChildren($('p', 'vacio', 'No se pudo cargar la lista de publicaciones.')));
</script>
</body>
</html>
