<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDES UP</title>
<style>
:root{
  --fondo:#eef1f4;--sup:#fff;--texto:#101a2b;--suave:#566377;--linea:#d5dbe3;--marca:#0e4f5c;
  --reportes:#2b5fb4;--investigaciones:#0e7a6d;--noticias:#b7791f;--propuestas-de-politica:#8a3b6b;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --fondo:#0f141b;--sup:#171e28;--texto:#e6eaf0;--suave:#94a0b2;--linea:#2a3441;--marca:#6cc0cf;
  --reportes:#7ea6ec;--investigaciones:#55c2b2;--noticias:#e0b252;--propuestas-de-politica:#d78bb8;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--marca)}
:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
.ancho{max-width:62rem;margin:0 auto;padding:0 1.25rem}
.salto{position:absolute;left:-999px}.salto:focus{left:1rem;top:1rem;background:var(--sup);padding:.5rem;z-index:5}
.cab{background:var(--sup);border-bottom:1px solid var(--linea)}
.cab .ancho{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding-top:.9rem;padding-bottom:.9rem}
.marca{font:700 1.5rem var(--serif);color:var(--texto);text-decoration:none;letter-spacing:-.01em}
nav.princ{display:flex;gap:.25rem;flex-wrap:wrap}
nav.princ a{padding:.4rem .8rem;border-radius:6px;color:var(--texto);text-decoration:none}
nav.princ a:hover{background:var(--fondo)}
nav a[aria-current]{font-weight:600;box-shadow:inset 0 -2px 0 var(--marca)}
main{padding-top:2.5rem;padding-bottom:4rem;outline:none}
h1{font:700 2.4rem/1.15 var(--serif);letter-spacing:-.015em;margin:0 0 .6rem}
h2{font:700 1.4rem var(--serif);margin:2.5rem 0 1rem}
h3{font-size:1rem;margin:1.5rem 0 .5rem;color:var(--suave)}
.lead{font-size:1.15rem;color:var(--suave);max-width:40rem;margin:0 0 1.5rem}
.boton{display:inline-block;background:var(--marca);color:var(--fondo);padding:.6rem 1.1rem;border-radius:6px;text-decoration:none;font-weight:600}
.pend{border:1px dashed var(--linea);border-radius:8px;padding:1.5rem;color:var(--suave);background:var(--sup)}
.tabs{display:flex;gap:1.25rem;overflow-x:auto;border-bottom:1px solid var(--linea);margin:0 0 2rem;white-space:nowrap}
.tabs a{padding:.5rem 0;color:var(--suave);text-decoration:none}
.tabs a[aria-current]{color:var(--texto);box-shadow:inset 0 -3px 0 var(--c,var(--marca))}
.cab-sec{border-top:4px solid var(--c);padding-top:1rem}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1rem}
.tarjeta{display:block;background:var(--sup);border:1px solid var(--linea);border-top:4px solid var(--c);border-radius:6px;padding:1rem 1.1rem;color:var(--texto);text-decoration:none}
.tarjeta:hover{border-color:var(--c)}
.tarjeta b{font:700 1.2rem var(--serif);display:block;margin-bottom:.25rem}
.tarjeta span{color:var(--suave);font-size:.9rem;display:block}
.tarjeta small{display:block;margin-top:.6rem;color:var(--c);font-weight:600}
.ctr{display:flex;gap:.6rem;flex-wrap:wrap;margin:0 0 .5rem}
input,select{font:inherit;color:inherit;background:var(--sup);border:1px solid var(--linea);border-radius:6px;padding:.5rem .7rem}
input{flex:1 1 14rem}
.cuenta{color:var(--suave);font-size:.9rem;margin:.5rem 0 0}
ul{list-style:none;margin:0;padding:0}
.doc{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;background:var(--sup);border-left:4px solid var(--c);border-radius:0 6px 6px 0;padding:.75rem 1rem;margin-bottom:.5rem}
.nombre{color:var(--texto);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.nombre:hover{color:var(--marca);text-decoration:underline}
.meta{color:var(--suave);font-size:.85rem;display:flex;gap:.9rem;flex-wrap:wrap;margin-top:.15rem}
.chip{color:var(--c);font-weight:600}
.vacio{color:var(--suave);padding:1.5rem 0}
footer{border-top:1px solid var(--linea);color:var(--suave);font-size:.9rem;padding:1.5rem 0}
dialog{width:min(64rem,94vw);height:90vh;padding:0;border:1px solid var(--linea);border-radius:8px;background:var(--sup);color:var(--texto)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 1rem;border-bottom:1px solid var(--linea)}
dialog header strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dialog header span{display:flex;gap:1rem;align-items:center;white-space:nowrap}
dialog button{font:inherit;color:inherit;background:none;cursor:pointer;border:1px solid var(--linea);border-radius:6px;padding:.3rem .75rem}
dialog iframe{flex:1;width:100%;border:0;background:#fff}
@media (max-width:34rem){h1{font-size:1.9rem}.doc{flex-direction:column;gap:.3rem}}
</style>
</head>
<body>
<a class="salto" href="#contenido">Saltar al contenido</a>
<header class="cab"><div class="ancho">
  <a class="marca" href="#/">CDES UP</a>
  <nav class="princ" id="nav" aria-label="Principal"></nav>
</div></header>
<main class="ancho" id="contenido" tabindex="-1"></main>
<footer><div class="ancho">© CDES UP. Texto de pie de página provisional.</div></footer>

<dialog id="visor" aria-label="Vista previa del documento">
  <header>
    <strong id="v-titulo"></strong>
    <span>
      <a id="v-abrir" target="_blank" rel="noopener">Abrir en pestaña nueva</a>
      <a id="v-bajar" download>Descargar</a>
      <button id="v-cerrar" type="button">Cerrar</button>
    </span>
  </header>
  <iframe id="v-marco" title="Documento"></iframe>
</dialog>

<script>
// ---- Configuración editable ----
const SITIO = 'CDES UP';
const MENU = [['inicio','Inicio'],['nosotros','Nosotros'],['eventos','Eventos'],['publicaciones','Publicaciones']];
const SECCIONES = [ // "id" = nombre de la subcarpeta en minúsculas, sin tildes y con guiones
  {id:'reportes', nombre:'Reportes', desc:'Texto provisional: informes periódicos y documentos de seguimiento.'},
  {id:'investigaciones', nombre:'Investigaciones', desc:'Texto provisional: estudios y análisis de largo aliento.'},
  {id:'noticias', nombre:'Noticias', desc:'Texto provisional: comunicados y novedades del centro.'},
  {id:'propuestas-de-politica', nombre:'Propuestas de política', desc:'Texto provisional: recomendaciones para la toma de decisiones públicas.'},
];
// ---------------------------------
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const $ = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const url = r => r.split('/').map(encodeURIComponent).join('/');
const peso = b => b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const color = id => id && id !== 'otros' ? `var(--${id})` : 'var(--suave)';
const secNombre = id => (SECCIONES.find(s => s.id === id) || {nombre: 'Otros'}).nombre;
const fechaTxt = f => { if (!f) return ''; const [y, m, d] = f.split('-'); return d ? `${+d} de ${MESES[m-1]} de ${y}` : m ? `${MESES[m-1]} de ${y}` : y; };
const porFecha = (a, b) => (!a.fecha !== !b.fecha) ? (a.fecha ? -1 : 1) : (b.fecha || '').localeCompare(a.fecha || '') || a.titulo.localeCompare(b.titulo, 'es', {numeric: true});

let docs = [], cargado = false, fallo = false;
const main = document.getElementById('contenido');

// ---- Visor de PDF ----
const visor = document.getElementById('visor'), marco = document.getElementById('v-marco');
const puedeVer = d => d.tipo === 'pdf' && navigator.pdfViewerEnabled && matchMedia('(min-width:700px)').matches;
function abrirVisor(d) {
  document.getElementById('v-titulo').textContent = d.titulo;
  document.getElementById('v-abrir').href = document.getElementById('v-bajar').href = url(d.ruta);
  marco.src = url(d.ruta); visor.showModal();
}
document.getElementById('v-cerrar').onclick = () => visor.close();
visor.addEventListener('click', e => { if (e.target === visor) visor.close(); });
visor.addEventListener('close', () => { marco.src = 'about:blank'; });

// ---- Lista de documentos ----
function itemDoc(d, conSeccion) {
  const li = $('li', 'doc'); li.style.setProperty('--c', color(d.seccion));
  const izq = $('div'), a = $('a', 'nombre', d.titulo); a.href = url(d.ruta); a.target = '_blank'; a.rel = 'noopener';
  a.onclick = e => { if (!(e.ctrlKey || e.metaKey || e.shiftKey) && puedeVer(d)) { e.preventDefault(); abrirVisor(d); } };
  const meta = $('div', 'meta');
  if (conSeccion) meta.append($('span', 'chip', secNombre(d.seccion)));
  if (d.subcategoria) meta.append($('span', '', d.subcategoria));
  if (d.fecha) meta.append($('span', '', fechaTxt(d.fecha)));
  meta.append($('span', '', d.tipo.toUpperCase()), $('span', '', peso(d.tamano)));
  izq.append(a, meta);
  const dl = $('a', '', 'Descargar'); dl.href = url(d.ruta); dl.setAttribute('download', '');
  li.append(izq, dl); return li;
}

function listado(base, conSeccion) {
  const caja = $('div'), ctr = $('div', 'ctr'), lista = $('div'), cuenta = $('p', 'cuenta');
  const q = $('input'); q.type = 'search'; q.placeholder = 'Buscar por título'; q.setAttribute('aria-label', 'Buscar por título');
  const sel = (et, ops) => { const s = $('select'); s.setAttribute('aria-label', et); ops.forEach(([v, t]) => s.append(new Option(t, v))); s.onchange = pintar; return s; };
  const anios = [...new Set(base.map(d => d.anio).filter(Boolean))].sort((a, b) => b - a);
  const ys = sel('Año', [['', 'Todos los años'], ...anios.map(a => [a, a])]);
  const ss = conSeccion ? sel('Tipo de publicación', [['', 'Todos los tipos'], ...SECCIONES.map(s => [s.id, s.nombre])]) : null;
  const os = sel('Orden', [['rec', 'Más recientes'], ['ant', 'Más antiguos'], ['az', 'Nombre A–Z']]);
  q.oninput = pintar;
  ctr.append(q, ...(ss ? [ss] : []), ys, os);
  function pintar() {
    const t = q.value.trim().toLowerCase();
    const r = base.filter(d => (!t || d.titulo.toLowerCase().includes(t)) && (!ys.value || String(d.anio) === ys.value) && (!ss || !ss.value || d.seccion === ss.value));
    if (os.value === 'az') r.sort((a, b) => a.titulo.localeCompare(b.titulo, 'es', {numeric: true}));
    else { r.sort(porFecha); if (os.value === 'ant') r.reverse(); }
    cuenta.textContent = r.length === 1 ? '1 documento' : r.length + ' documentos';
    lista.replaceChildren();
    if (!r.length) { lista.append($('p', 'vacio', base.length ? 'Ningún documento coincide con los filtros.' : 'Todavía no hay documentos en esta sección.')); return; }
    const grupos = new Map();
    r.forEach(d => { const k = os.value === 'az' ? '' : (d.anio || 'Sin fecha'); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(d); });
    grupos.forEach((arr, k) => { if (k) lista.append($('h3', '', k)); const ul = $('ul'); arr.forEach(d => ul.append(itemDoc(d, conSeccion))); lista.append(ul); });
  }
  pintar(); caja.append(ctr, cuenta, lista); return caja;
}

// ---- Páginas ----
const pendiente = (t, txt) => { const f = document.createDocumentFragment(); f.append($('h1', '', t), $('div', 'pend', txt)); return f; };

function inicio() {
  const f = document.createDocumentFragment();
  f.append($('h1', '', SITIO), $('p', 'lead', 'Texto provisional: aquí irá una frase breve que explique qué es el centro y qué hace.'));
  const b = $('a', 'boton', 'Ver publicaciones'); b.href = '#/publicaciones'; f.append(b, $('h2', '', 'Publicaciones recientes'));
  if (!cargado) f.append($('p', 'vacio', 'Cargando…'));
  else if (!docs.length) f.append($('p', 'vacio', 'Todavía no hay publicaciones.'));
  else { const ul = $('ul'); [...docs].sort(porFecha).slice(0, 5).forEach(d => ul.append(itemDoc(d, true))); f.append(ul); }
  return f;
}

function publicaciones(id) {
  const f = document.createDocumentFragment(), sec = SECCIONES.find(s => s.id === id);
  const tabs = $('nav', 'tabs'); tabs.setAttribute('aria-label', 'Secciones de publicaciones');
  [['', 'Todas'], ...SECCIONES.map(s => [s.id, s.nombre])].forEach(([i, n]) => {
    const a = $('a', '', n); a.href = '#/publicaciones' + (i ? '/' + i : '');
    if (i === (id || '')) a.setAttribute('aria-current', 'page');
    if (i) a.style.setProperty('--c', color(i)); tabs.append(a);
  });
  f.append(tabs);
  if (id && !sec) { f.append($('h1', '', 'Sección no encontrada'), $('p', 'vacio', 'Elige una sección en el menú de arriba.')); return f; }
  if (!cargado) { f.append($('p', 'vacio', fallo ? 'No se pudo cargar la lista de documentos.' : 'Cargando…')); return f; }
  if (sec) {
    const h = $('div', 'cab-sec'); h.style.setProperty('--c', color(sec.id));
    h.append($('h1', '', sec.nombre), $('p', 'lead', sec.desc)); f.append(h, listado(docs.filter(d => d.seccion === sec.id), false));
  } else {
    f.append($('h1', '', 'Publicaciones'), $('p', 'lead', 'Texto provisional: elige un tipo de publicación o busca en todo el archivo.'));
    const g = $('div', 'tarjetas');
    SECCIONES.forEach(s => {
      const n = docs.filter(d => d.seccion === s.id).length, a = $('a', 'tarjeta'); a.href = '#/publicaciones/' + s.id; a.style.setProperty('--c', color(s.id));
      a.append($('b', '', s.nombre), $('span', '', s.desc), $('small', '', n === 1 ? '1 documento' : n + ' documentos')); g.append(a);
    });
    f.append(g, $('h2', '', 'Todas las publicaciones'), listado(docs, true));
  }
  return f;
}

// ---- Rutas ----
function render() {
  const [pag = 'inicio', sub] = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const nav = document.getElementById('nav'); nav.replaceChildren();
  MENU.forEach(([i, n]) => { const a = $('a', '', n); a.href = '#/' + (i === 'inicio' ? '' : i); if (i === pag) a.setAttribute('aria-current', 'page'); nav.append(a); });
  let t = SITIO, c;
  if (pag === 'inicio') c = inicio();
  else if (pag === 'nosotros') { t = 'Nosotros'; c = pendiente(t, 'Sección en construcción. Aquí irá la historia, la misión y el equipo.'); }
  else if (pag === 'eventos') { t = 'Eventos'; c = pendiente(t, 'Sección en construcción. Aquí irá el calendario de eventos.'); }
  else if (pag === 'publicaciones') { t = 'Publicaciones'; c = publicaciones(sub); }
  else c = pendiente('Página no encontrada', 'Usa el menú para volver a una sección.');
  document.title = t === SITIO ? SITIO : `${t} | ${SITIO}`;
  main.replaceChildren(c);
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); main.focus({preventScroll: true}); });
render();
fetch('documentos.json').then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(d => { docs = d; cargado = true; }).catch(() => { fallo = true; }).finally(render);
</script>
</body>
</html>
