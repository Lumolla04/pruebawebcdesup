<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentos</title>
  <style>
    :root {
      --fondo: #f5f6f8;
      --texto: #1c2430;
      --suave: #5d6877;
      --linea: #d9dde4;
      --acento: #1d4fc4;
      --superficie: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #14181f;
        --texto: #e7eaef;
        --suave: #9aa5b4;
        --linea: #2b3340;
        --acento: #7fa3ff;
        --superficie: #1a2029;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 46rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
    h1 { font-size: 2rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
    #resumen { margin: 0 0 1.75rem; color: var(--suave); }
    .controles { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 2rem; }
    input, select {
      font: inherit; color: inherit; background: var(--superficie);
      border: 1px solid var(--linea); border-radius: 6px; padding: .55rem .75rem;
    }
    input { flex: 1 1 14rem; }
    :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
    h2 {
      font-size: 1.05rem; margin: 2rem 0 .5rem; padding-bottom: .4rem;
      border-bottom: 1px solid var(--linea);
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 1rem; padding: .65rem 0; border-bottom: 1px solid var(--linea);
    }
    .nombre { color: var(--texto); font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
    .nombre:hover { color: var(--acento); text-decoration: underline; }
    .detalle { color: var(--suave); font-size: .875rem; white-space: nowrap; }
    .detalle a { color: var(--acento); margin-left: .75rem; }
    .vacio { color: var(--suave); padding: 2rem 0; }
    @media (max-width: 30rem) {
      li { flex-direction: column; gap: .15rem; }
    }
    dialog {
      width: min(64rem, 94vw); height: 90vh; padding: 0;
      border: 1px solid var(--linea); border-radius: 8px;
      background: var(--superficie); color: var(--texto);
    }
    dialog[open] { display: flex; flex-direction: column; }
    dialog::backdrop { background: rgba(0, 0, 0, .55); }
    dialog header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; padding: .7rem 1rem; border-bottom: 1px solid var(--linea);
    }
    dialog header strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    dialog header span { display: flex; gap: 1rem; align-items: center; white-space: nowrap; }
    dialog a { color: var(--acento); }
    dialog button {
      font: inherit; color: inherit; background: none; cursor: pointer;
      border: 1px solid var(--linea); border-radius: 6px; padding: .3rem .75rem;
    }
    dialog iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Documentos</h1>
    <p id="resumen">Cargando…</p>
    <div class="controles">
      <input id="buscar" type="search" placeholder="Buscar por nombre" aria-label="Buscar documentos">
      <select id="orden" aria-label="Ordenar">
        <option value="asc">Nombre A–Z</option>
        <option value="desc">Nombre Z–A</option>
      </select>
    </div>
    <div id="lista"></div>
  </main>

  <dialog id="visor" aria-label="Vista previa del documento">
    <header>
      <strong id="visor-titulo"></strong>
      <span>
        <a id="visor-abrir" target="_blank" rel="noopener">Abrir en pestaña nueva</a>
        <a id="visor-descargar" download>Descargar</a>
        <button id="visor-cerrar" type="button">Cerrar</button>
      </span>
    </header>
    <iframe id="visor-marco" title="Documento"></iframe>
  </dialog>

  <script>
    let documentos = [];
    const lista = document.getElementById('lista');
    const resumen = document.getElementById('resumen');
    const buscar = document.getElementById('buscar');
    const orden = document.getElementById('orden');

    const url = ruta => ruta.split('/').map(encodeURIComponent).join('/');
    const peso = b => b < 1048576
      ? Math.max(1, Math.round(b / 1024)) + ' KB'
      : (b / 1048576).toFixed(1) + ' MB';

    const visor = document.getElementById('visor');
    const marco = document.getElementById('visor-marco');

    // Solo se usa el visor si es un PDF, el navegador puede mostrarlos
    // y la pantalla es ancha. En otros casos se abre en una pestaña nueva.
    const puedeVisualizar = d =>
      d.tipo === 'pdf' && navigator.pdfViewerEnabled &&
      matchMedia('(min-width: 700px)').matches;

    function abrirVisor(d) {
      document.getElementById('visor-titulo').textContent = d.nombre;
      document.getElementById('visor-abrir').href = url(d.ruta);
      document.getElementById('visor-descargar').href = url(d.ruta);
      marco.src = url(d.ruta);
      visor.showModal();
    }

    document.getElementById('visor-cerrar').addEventListener('click', () => visor.close());
    visor.addEventListener('click', e => { if (e.target === visor) visor.close(); });
    visor.addEventListener('close', () => { marco.src = 'about:blank'; });

    function pintar() {
      const q = buscar.value.trim().toLowerCase();
      const dir = orden.value === 'asc' ? 1 : -1;
      const filtrados = documentos
        .filter(d => d.nombre.toLowerCase().includes(q) || d.categoria.toLowerCase().includes(q))
        .sort((a, b) => dir * a.nombre.localeCompare(b.nombre, 'es', { numeric: true }));

      resumen.textContent = filtrados.length === 1
        ? '1 documento'
        : filtrados.length + ' documentos';
      lista.replaceChildren();

      if (!filtrados.length) {
        const p = document.createElement('p');
        p.className = 'vacio';
        p.textContent = documentos.length
          ? 'Ningún documento coincide con la búsqueda.'
          : 'Todavía no hay documentos publicados.';
        lista.append(p);
        return;
      }

      const grupos = {};
      filtrados.forEach(d => (grupos[d.categoria] ||= []).push(d));

      Object.keys(grupos).sort((a, b) => a.localeCompare(b, 'es')).forEach(cat => {
        const h = document.createElement('h2');
        h.textContent = cat;
        const ul = document.createElement('ul');
        grupos[cat].forEach(d => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.className = 'nombre';
          a.href = url(d.ruta);
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = d.nombre;
          a.addEventListener('click', e => {
            if (e.ctrlKey || e.metaKey || e.shiftKey) return;
            if (puedeVisualizar(d)) { e.preventDefault(); abrirVisor(d); }
          });
          const det = document.createElement('span');
          det.className = 'detalle';
          det.textContent = d.tipo.toUpperCase() + ' · ' + peso(d.tamano);
          const dl = document.createElement('a');
          dl.href = url(d.ruta);
          dl.setAttribute('download', '');
          dl.textContent = 'Descargar';
          det.append(dl);
          li.append(a, det);
          ul.append(li);
        });
        lista.append(h, ul);
      });
    }

    fetch('documentos.json')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(datos => { documentos = datos; pintar(); })
      .catch(() => {
        resumen.textContent = 'No se pudo cargar la lista de documentos.';
      });

    buscar.addEventListener('input', pintar);
    orden.addEventListener('change', pintar);
  </script>
</body>
</html>
